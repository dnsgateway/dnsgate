# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: dnsgate

dist: bin
builds:
  - id: dnsgate
    main: ./cmd/dnsgate
    binary: dnsgate
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    goarm64:
      - v8.0

  - id: dnsgate-cli
    main: ./cmd/dnsgate-cli
    binary: dnsgate-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    goarm64:
      - v8.0

  - id: dnsgate-acme
    main: ./cmd/dnsgate-acme
    binary: dnsgate-acme
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    goarm64:
      - v8.0

snapshot:
  version_template: edge

changelog:
  disable: true

archives:
  - id: dnsgate-cli
    ids:
      - dnsgate-cli
    name_template: "dnsgate-cli_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - formats:
          - zip
        goos: windows
    files:
      - LICENSE

dockers_v2:
  - id: docker
    ids:
      - dnsgate
    flags:
      - --target=gorelease
    images:
      - "ghcr.io/dnsgateway/{{ .ProjectName }}"
    tags:
      - "{{ if not .IsSnapshot }}v{{.Version}}{{ else }}edge{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    annotations:
      org.opencontainers.image.name: "{{ .ProjectName }}"
      org.opencontainers.image.description: "DNSGate is a DNS gateway service"
      org.opencontainers.image.licenses: "MPL-2.0"
      org.opencontainers.image.source: "https://github.com/dnsgateway/{{ .ProjectName }}"
      org.opencontainers.image.url: "{{ .GitURL }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      io.artifacthub.package.readme-url: "https://raw.githubusercontent.com/dnsgateway/{{ .ProjectName }}/main/README.md"
      io.artifacthub.package.license: "MPL-2.0"

  - id: docker-acme
    ids:
      - dnsgate-acme
    flags:
      - --target=gorelease-acme
    images:
      - "ghcr.io/dnsgateway/{{ .ProjectName }}-acme"
    tags:
      - "{{ if not .IsSnapshot }}v{{.Version}}{{ else }}edge{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    annotations:
      org.opencontainers.image.name: "{{ .ProjectName }}-acme"
      org.opencontainers.image.description: "DNSGate ACME Endpoint serves the acme-dns API through the DNS gateway"
      org.opencontainers.image.licenses: "MPL-2.0"
      org.opencontainers.image.source: "https://github.com/dnsgateway/{{ .ProjectName }}"
      org.opencontainers.image.url: "{{ .GitURL }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      io.artifacthub.package.readme-url: "https://raw.githubusercontent.com/dnsgateway/{{ .ProjectName }}/main/README.md"
      io.artifacthub.package.license: "MPL-2.0"

docker_signs:
  - id: docker
    cmd: cosign
    args:
      - sign
      - "--yes"
      - "${artifact}"
    output: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - artifacts: checksum
    signature: "${artifact}.sigstore.json"
    cmd: cosign
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    output: true

homebrew_casks:
  - name: dnsgate-cli
    ids:
      - dnsgate-cli
    directory: Casks
    homepage: https://github.com/dnsgateway/dnsgate
    description: "DNSGate CLI tool"
    license: "MPL-2.0"

    commit_author:
      name: dnsgateway
      email: dnsgateway@dnsgate.link
    repository:
      owner: dnsgateway
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TOKEN }}"

    custom_block: |
      arch arm: "arm64", intel: "amd64"

    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/dnsgate-cli_darwin_#{arch}"]
          end
