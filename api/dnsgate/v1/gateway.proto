syntax = "proto3";

// Package dnsgate.v1 is the Gateway's gRPC API.
package dnsgate.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/dnsgateway/dnsgate/api/dnsgate/v1;dnsgatev1";

// Gateway authorizes requests presented with a Service Token and executes
// them against the token's Provider.
service GatewayService {
  // Call opens one stream per request. The client sends one CallRequest
  // holding a Request and the Gateway answers with one CallResponse holding
  // the Response, or ends the stream with an error status.
  //
  // A request that goes through Agent Egress relays the Gateway's
  // connections to the Provider inside the same stream, before the
  // Response: the Gateway sends RelayOpen, the client, as Egress Agent,
  // connects and answers RelayOpened, then each side sends RelayData and
  // ends its direction with RelayClose (ADR 0006). The client keeps its
  // side of the stream open until the Response, so that it can relay.
  //
  // A failed request ends the stream with a gRPC status carrying an Error
  // detail.
  rpc Call(stream CallRequest) returns (stream CallResponse);
}

// CallRequest is one message the client sends on a Call stream.
message CallRequest {
  oneof message {
    // Request is the first message of a stream.
    Request request = 1;
    // opened answers a RelayOpen.
    RelayOpened opened = 2;
    // data carries bytes the Provider sent on a relayed connection.
    RelayData data = 3;
    // close says the Provider sends no more bytes on a relayed
    // connection.
    RelayClose close = 4;
  }
  // Field numbers 5 to 15 are kept for further relay frames.
  reserved 5 to 15;
}

// CallResponse is one message the Gateway sends on a Call stream.
message CallResponse {
  oneof message {
    // Response answers the stream's Request. It is the last message:
    // relayed connections still open end with it.
    Response response = 1;
    // open asks the client, as Egress Agent, to connect to the Provider.
    RelayOpen open = 2;
    // data carries bytes for the Provider on a relayed connection.
    RelayData data = 3;
    // close says the Gateway sends no more bytes on a relayed
    // connection.
    RelayClose close = 4;
  }
  // Field numbers 5 to 15 are kept for further relay frames.
  reserved 5 to 15;
}

// RelayOpen asks the Egress Agent to open a TCP connection to the
// Provider and relay it. The Egress Agent connects only to port 443 of a
// host that resolves to no loopback, private, link-local, CGNAT, unique
// local or unspecified address (ADR 0002).
message RelayOpen {
  // id names the connection in the stream's later relay frames. The
  // Gateway numbers connections from 1 and never reuses an id in a
  // stream.
  uint32 id = 1;
  // host is the full hostname of the Provider's API, such as
  // "api.cloudflare.com".
  string host = 2;
  uint32 port = 3;
}

// RelayOpened is the Egress Agent's answer to a RelayOpen.
message RelayOpened {
  // id is the RelayOpen's.
  uint32 id = 1;
  // error says why the Egress Agent did not connect; empty when it did.
  string error = 2;
}

// RelayData carries bytes of a relayed connection: the TLS records the
// Gateway and the Provider exchange, which the Egress Agent cannot read.
message RelayData {
  // id names the connection.
  uint32 id = 1;
  // data is at most 32 KiB.
  bytes data = 2;
}

// RelayClose ends one direction of a relayed connection, like a TCP FIN:
// its sender sends no more RelayData for id. A connection is gone once
// both sides have sent RelayClose, or with the stream.
message RelayClose {
  // id names the connection.
  uint32 id = 1;
}

// Request is one Gateway operation.
message Request {
  oneof operation {
    OnboardRequest onboard = 1;
    InspectTokenRequest inspect_token = 2;
    ResealTokenRequest reseal_token = 3;
    ListZonesRequest list_zones = 4;
    GetZoneRequest get_zone = 5;
    ListRecordsRequest list_records = 6;
    GetRecordRequest get_record = 7;
    CreateTokenRequest create_token = 8;
    CreateRecordRequest create_record = 9;
    UpdateRecordRequest update_record = 10;
    PatchRecordRequest patch_record = 11;
    DeleteRecordRequest delete_record = 12;
    RevokeTokenRequest revoke_token = 13;
  }
}

// Response is the result of a Request, of the same operation.
message Response {
  oneof result {
    OnboardResponse onboard = 1;
    InspectTokenResponse inspect_token = 2;
    ResealTokenResponse reseal_token = 3;
    ListZonesResponse list_zones = 4;
    GetZoneResponse get_zone = 5;
    ListRecordsResponse list_records = 6;
    GetRecordResponse get_record = 7;
    CreateTokenResponse create_token = 8;
    CreateRecordResponse create_record = 9;
    UpdateRecordResponse update_record = 10;
    PatchRecordResponse patch_record = 11;
    DeleteRecordResponse delete_record = 12;
    RevokeTokenResponse revoke_token = 13;
  }
}

// OnboardRequest turns a Provider Credential into a Root Token.
message OnboardRequest {
  // bootstrap_secret is the secret configured on the Gateway. Onboarding
  // without it, or with a wrong one, fails as unauthenticated.
  string bootstrap_secret = 1;
  // provider names the Provider the credential authenticates to, such as
  // "cloudflare".
  string provider = 2;
  // credential is the plaintext Provider Credential. It is protected in
  // transit by the TLS connection to the Gateway (ADR 0005).
  Credential credential = 3;
  // expires is the Root Token's lifetime. Left out, the Root Token never
  // expires.
  optional google.protobuf.Duration expires = 4;
}

// Credential is a Provider Credential.
message Credential {
  // type is the kind of credential, such as "api-token" for Cloudflare.
  string type = 1;
  // value is the secret itself.
  string value = 2;
}

// OnboardResponse carries the new Root Token.
message OnboardResponse {
  // token is the Root Token. Its Service Account is "root".
  string token = 1;
}

// InspectTokenRequest asks the Gateway to open a Service Token and show its
// claims to its holder.
message InspectTokenRequest {
  // token is the Service Token to inspect.
  string token = 1;
}

// InspectTokenResponse is the content of a Service Token, without its
// Provider Credential.
message InspectTokenResponse {
  // sub is the Service Account the token was issued for.
  string sub = 1;
  // jti is the token ID.
  string jti = 2;
  // ancestors lists the IDs of every token above this one, root first.
  repeated string ancestors = 3;
  google.protobuf.Timestamp iat = 4;
  google.protobuf.Timestamp nbf = 5;
  // exp is left out for a token that never expires.
  optional google.protobuf.Timestamp exp = 6;
  // provider names the token's Provider.
  string provider = 7;
  repeated Permission permissions = 8;
}

// CreateTokenRequest asks the Gateway to issue a Derived Token. It needs
// create on tokens. The Derived Token gets the Parent Token's Provider and
// Provider Credential, and must not exceed the Parent Token (Narrowing):
// otherwise the request fails as a narrowing violation naming the
// dimension.
message CreateTokenRequest {
  // token is the Parent Token.
  string token = 1;
  // sub is the Service Account the Derived Token is issued for.
  string sub = 2;
  // permissions are the Derived Token's Permissions, each with verbs. They
  // must be covered by the Parent Token's.
  repeated Permission permissions = 3;
  // expires is the Derived Token's lifetime. It must end no later than the
  // Parent Token's. Left out, the Derived Token never expires, which only
  // a Parent Token that never expires allows.
  optional google.protobuf.Duration expires = 4;
}

// CreateTokenResponse carries the new Derived Token.
message CreateTokenResponse {
  // token is the Derived Token.
  string token = 1;
  // jti is the Derived Token's ID.
  string jti = 2;
}

// ResealTokenRequest asks the Gateway to reseal a Service Token: to
// re-encrypt it under the Gateway's current encryption key. The token
// itself authorizes the request, since resealing changes none of its
// claims.
message ResealTokenRequest {
  // token is the Service Token to reseal. It must still open: valid, not
  // expired, and sealed under a key that is not retired.
  string token = 1;
}

// ResealTokenResponse carries the resealed Service Token.
message ResealTokenResponse {
  // token holds the same claims and signature as the request's token,
  // sealed under the current encryption key.
  string token = 1;
}

// RevokeTokenRequest asks the Gateway to revoke a Service Token: it, and
// every token derived from it, stops working from the next request on,
// for good. It needs delete on tokens. Such a token may revoke any token
// ID, since the Gateway keeps no registry of which chain an ID belongs to
// (ADR 0001).
message RevokeTokenRequest {
  // token is the Service Token that authorizes the request.
  string token = 1;
  // target names the token to revoke.
  oneof target {
    // token_id is the ID (jti) of the token to revoke. The Gateway cannot
    // learn a token's expiry from its ID, so it keeps the revocation
    // forever.
    string token_id = 2;
    // target_token is the Service Token to revoke. It must open: valid,
    // not expired, and sealed under a key that is not retired. The
    // Gateway keeps the revocation until the token expires, or forever if
    // it never does.
    string target_token = 3;
  }
}

// RevokeTokenResponse confirms a revocation.
message RevokeTokenResponse {
  // jti is the ID of the token revoked.
  string jti = 1;
}

// Egress is where the connection to the Provider leaves from.
enum Egress {
  // The request does not ask for an Egress: the Gateway uses Gateway
  // Egress if the token allows it, else Agent Egress.
  EGRESS_UNSPECIFIED = 0;
  // Gateway Egress: the Provider sees the Gateway's source IP.
  EGRESS_GATEWAY = 1;
  // Agent Egress: the Provider sees the client's source IP. The client
  // relays the Gateway's connection inside the request's stream.
  EGRESS_AGENT = 2;
}

// ListZonesRequest asks for the zones the token's Provider Credential
// reaches. It needs list on zones.
message ListZonesRequest {
  // token is the Service Token that authorizes the request.
  string token = 1;
  Egress egress = 2;
}

// ListZonesResponse lists the zones the token covers; the others are left
// out.
message ListZonesResponse {
  repeated Zone zones = 1;
}

// GetZoneRequest asks for one zone. It needs get on zones.
message GetZoneRequest {
  // token is the Service Token that authorizes the request.
  string token = 1;
  Egress egress = 2;
  // zone is the zone's name, such as "example.com".
  string zone = 3;
}

// GetZoneResponse carries the zone asked for.
message GetZoneResponse {
  Zone zone = 1;
}

// Zone is a DNS zone hosted at the Provider.
message Zone {
  // State is whether the Provider serves the zone.
  enum State {
    STATE_UNSPECIFIED = 0;
    // The Provider serves the zone.
    STATE_ACTIVE = 1;
    // The zone waits for its delegation to name the Provider's
    // nameservers.
    STATE_PENDING = 2;
    // The zone's delegation left the Provider.
    STATE_MOVED = 3;
  }

  // name is the zone's name, such as "example.com".
  string name = 1;
  State state = 2;
  // nameservers are the nameservers the Provider assigned to the zone,
  // when it assigns them per zone.
  repeated string nameservers = 3;
}

// ListRecordsRequest asks for a zone's records. It needs list on records
// in the zone.
message ListRecordsRequest {
  // token is the Service Token that authorizes the request.
  string token = 1;
  Egress egress = 2;
  // zone is the zone's name, such as "example.com".
  string zone = 3;
}

// ListRecordsResponse lists the zone's RRsets the token covers; the others
// are left out.
message ListRecordsResponse {
  repeated RecordSet record_sets = 1;
}

// GetRecordRequest asks for one RRset: every record of a name and type.
// It needs get on records for the zone, name and type.
message GetRecordRequest {
  // token is the Service Token that authorizes the request.
  string token = 1;
  Egress egress = 2;
  // zone is the zone's name, such as "example.com".
  string zone = 3;
  // name is the record name relative to the zone, "@" for the zone's own
  // name.
  string name = 4;
  // type is the record type, such as "A" or "TXT".
  string type = 5;
}

// GetRecordResponse carries the RRset asked for.
message GetRecordResponse {
  RecordSet record_set = 1;
}

// CreateRecordRequest asks to create an RRset: records of one name and
// type, one per value. It needs create on records for the zone, name and
// type. The zone must not hold the RRset yet.
message CreateRecordRequest {
  // token is the Service Token that authorizes the request.
  string token = 1;
  Egress egress = 2;
  // zone is the zone's name, such as "example.com".
  string zone = 3;
  // name is the record name relative to the zone, "@" for the zone's own
  // name.
  string name = 4;
  // type is the record type, such as "A" or "TXT".
  string type = 5;
  // ttl is the TTL of every record, in seconds, in the range the Provider
  // takes.
  uint32 ttl = 6;
  // values are the records' values in zone-file presentation form, at
  // least one and each once.
  repeated string values = 7;
}

// CreateRecordResponse carries the RRset as created.
message CreateRecordResponse {
  RecordSet record_set = 1;
}

// UpdateRecordRequest asks to replace an RRset: afterwards the zone holds
// one record of the name and type per value, and no other. It needs
// update on records for the zone, name and type. The zone must hold the
// RRset already.
message UpdateRecordRequest {
  // token is the Service Token that authorizes the request.
  string token = 1;
  Egress egress = 2;
  // zone is the zone's name, such as "example.com".
  string zone = 3;
  // name is the record name relative to the zone, "@" for the zone's own
  // name.
  string name = 4;
  // type is the record type, such as "A" or "TXT".
  string type = 5;
  // ttl is the TTL of every record, in seconds, in the range the Provider
  // takes.
  uint32 ttl = 6;
  // values are the records' values in zone-file presentation form, at
  // least one and each once.
  repeated string values = 7;
}

// UpdateRecordResponse carries the RRset as replaced.
message UpdateRecordResponse {
  RecordSet record_set = 1;
}

// PatchRecordRequest asks to add values to an RRset and remove others
// from it, leaving its other records as they are, as an ACME client does
// with its TXT values. It needs patch on records for the zone, name and
// type. Adding a value the RRset holds and removing one it does not hold
// change nothing. Adding to an RRset the zone lacks creates it; removing
// its last value deletes it.
message PatchRecordRequest {
  // token is the Service Token that authorizes the request.
  string token = 1;
  Egress egress = 2;
  // zone is the zone's name, such as "example.com".
  string zone = 3;
  // name is the record name relative to the zone, "@" for the zone's own
  // name.
  string name = 4;
  // type is the record type, such as "A" or "TXT".
  string type = 5;
  // ttl is the TTL of the records added, in seconds. Left out, they take
  // the RRset's TTL; it is needed to create an RRset.
  uint32 ttl = 6;
  // add are the values to add, in zone-file presentation form.
  repeated string add = 7;
  // remove are the values to remove. A value is given once, in add or in
  // remove.
  repeated string remove = 8;
}

// PatchRecordResponse carries the RRset as patched.
message PatchRecordResponse {
  // record_set is left out when the patch removed the RRset's last
  // value.
  RecordSet record_set = 1;
}

// DeleteRecordRequest asks to delete an RRset: every record of a name and
// type. It needs delete on records for the zone, name and type. The zone
// must hold the RRset.
message DeleteRecordRequest {
  // token is the Service Token that authorizes the request.
  string token = 1;
  Egress egress = 2;
  // zone is the zone's name, such as "example.com".
  string zone = 3;
  // name is the record name relative to the zone, "@" for the zone's own
  // name.
  string name = 4;
  // type is the record type, such as "A" or "TXT".
  string type = 5;
}

// DeleteRecordResponse confirms the RRset is deleted.
message DeleteRecordResponse {}

// RecordSet is an RRset: the records of one name and type.
message RecordSet {
  // name is the record name relative to the zone, "@" for the zone's own
  // name.
  string name = 1;
  // type is the record type in upper case, such as "TXT".
  string type = 2;
  // ttl is the RRset's TTL in seconds: the lowest of its records'.
  uint32 ttl = 3;
  // values are the records' values in zone-file presentation form.
  repeated string values = 4;
}

// Permission grants verbs on resources, limited by the zone, name, type
// and egress filters. An empty filter is left out and means "any"; an
// empty resources means ["records"].
message Permission {
  repeated string verbs = 1;
  repeated string resources = 2;
  repeated string zones = 3;
  repeated string names = 4;
  repeated string types = 5;
  repeated string egress = 6;
}

// Error is the detail of every error status the Gateway returns.
message Error {
  // Category is what kind of failure the error is.
  enum Category {
    CATEGORY_UNSPECIFIED = 0;
    // The request is malformed or names something the Gateway does not
    // support.
    CATEGORY_INVALID_REQUEST = 1;
    // The bootstrap secret or Service Token was missing or not accepted.
    CATEGORY_UNAUTHENTICATED = 2;
    // The token's Permissions do not allow the request.
    CATEGORY_PERMISSION_DENIED = 3;
    // A Derived Token would exceed its Parent Token; see dimension.
    CATEGORY_NARROWING_VIOLATION = 4;
    // The Provider refused the request; see provider_status.
    CATEGORY_DENIED_BY_PROVIDER = 5;
    CATEGORY_NOT_FOUND = 6;
    CATEGORY_RATE_LIMITED = 7;
    CATEGORY_INVALID_RECORD = 8;
    // No longer returned: the Gateway supports every Egress. Kept so
    // that its number is never reused.
    CATEGORY_EGRESS_NOT_SUPPORTED = 9 [deprecated = true];
    // The Gateway failed; the details are in its logs.
    CATEGORY_INTERNAL = 10;
    // The request collides with what the Provider holds, such as an RRset
    // that already exists, or records that changed at the Provider while
    // the Gateway changed them.
    CATEGORY_CONFLICT = 11;
  }

  Category category = 1;
  // dimension names what exceeded the Parent Token in a narrowing
  // violation, such as "zones" or "exp".
  string dimension = 2;
  // provider_status is the Provider's HTTP status for a Provider error.
  int32 provider_status = 3;
}
