{{- if .Values.acme.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dnsgate.fullname" . }}-acme
  labels:
    {{- include "dnsgate.labels" . | nindent 4 }}
    app.kubernetes.io/component: acme
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: acme
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "dnsgate.labels" . | nindent 8 }}
        app.kubernetes.io/component: acme
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      enableServiceLinks: false
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gate.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-acme
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.acme.image.repository }}:{{ .Values.acme.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.acme.image.pullPolicy }}
          args:
            - --listen=:8080
            - --ca-file=/var/run/certs/tls.crt
            - --gateway={{ include "dnsgate.fullname" . }}.svc.{{ .Release.Namespace }}
            - --challenge-map=/etc/dnsgate-acme/acme-challenge.yaml
            - --log-level=debug
          {{- with .Values.args }}
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.env }}
          env:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/dnsgate-acme
              readOnly: false
            - name: certs
              mountPath: /var/run/certs
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "dnsgate.fullname" . }}
        - name: certs
          secret:
            defaultMode: 256
            secretName: {{ include "dnsgate.fullname" . }}-tls
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- include "affinities-acme.pods" . | nindent 8 }}
      {{- with .Values.affinity }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
