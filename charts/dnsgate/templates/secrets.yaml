{{- if not .Values.dnsgate.secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dnsgate.fullname" . }}
  labels:
    {{- include "dnsgate.labels" . | nindent 4 }}
data:
  sig-2026-10.pem: {{ .Values.dnsgate.secrets.sig | b64enc }}
  enc-2026-10.pem: {{ .Values.dnsgate.secrets.enc | b64enc }}
  bootstrap-secret: {{ .Values.dnsgate.secrets.bootstrap | b64enc }}
{{- end }}
