apiVersion: v1
kind: Service
metadata:
  name: {{ include "dnsgate.fullname" . }}-acme
  labels:
    {{- include "dnsgate.labels" . | nindent 4 }}
    app.kubernetes.io/component: acme
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ipFamilyPolicy: {{ if eq (len .Values.service.ipFamilies) 2 }}PreferDualStack{{ else }}SingleStack{{ end }}
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gate.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: acme
